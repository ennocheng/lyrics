  - title: 有時候我會想要傷害我的朋友
    en_title: Friendly Fire：On
    lyricist: 鄭宜農
    composer: 鄭宜農
    from_album: 有時候我會想要傷害我的朋友
    default_language: zh
    lyrics:
      zh: |
        〈有時候我會想要傷害我的朋友〉

        有時候我會想要傷害某個人
        有時候我是真的會去做
        想要給予 再收回 表演一種自由

        有時候我會想要傷害我的朋友
        有時候我是真的會去做
        想要冷笑 再起身 表演一種冷漠

        There’s a secret between us.
        你留下來的 成為我
        可以殘忍也可以溫柔
        可以擁抱後立刻轉頭

        不安的感覺來了不好意思暫離
        嘗試去呼吸可是這裡沒有空氣
        我微笑 我起身
        我想我感覺得到你
        你是出現 你是離開 是世間的規矩
        是一根菸 一個眼神 是打字的聲音
        是話一句 又一句
        來得這麼輕易
        是能夠讓人相信 搞砸一切的是自己

        有時候我會想要傷害某個人
        有時候我是真的會去做
        想要給予 再收回 表演一種自由

        有時候我會想要傷害我的朋友
        有時候我是真的會去做
        想要冷笑 再起身 表演一種冷漠

        There’s a secret between us.
        你留下來的 成為我
        可以殘忍也可以溫柔
        可以擁抱後立刻轉頭

        I keep the secret between us.
        你留下來的 只有我
        可以暴力也可以天真
        可以輕鬆地笑著說「有一點痛」
        有一點痛

        I take it all.
        I just take it all.
        Can’t help but take it all.
        I take it all.
      en: |
        〈Friendly Fire：On〉

        Sometimes I think about hurting someone
        Sometimes I actually mean to do it
        To give then take back, to perform a kind of freedom

        Sometimes I think about hurting my friends
        Sometimes I actually mean to do it
        To sneer then stand up, to perform a kind of indifference

        There’s a secret between us.
        What you left behind becomes me
        Can be cruel, can be tender
        Can embrace, then turn away right after

        Unease comes, feel bad stepping away
        Try to breathe but no air in here
        I smile, I stand up
        I think I can feel you
        You're the coming, you're the going, you’re the way things are
        A cigarette, a glance, the sound of typing
        Words, one after another
        Coming so easily
        Can make one believe they ruined everything

        Sometimes I think about hurting someone
        Sometimes I actually mean to do it
        To give then take back, to perform a kind of freedom

        Sometimes I think about hurting my friends
        Sometimes I actually mean to do it
        To sneer then stand up, to perform a kind of indifference

        There’s a secret between us.
        What you left behind becomes me
        Can be cruel, can be tender
        Can embrace then turn away right after

        I keep the secret between us.
        What you left behind is just me
        Can be violent, can be naive
        Can smile easily and say "It hurts a bit"
        It hurts a bit

        I take it all.
        I just take it all.
        Can’t help but take it all.
        I take it all.
      jp: |
        〈ときどき 友達を傷つけたくなる〉

        ときどき 誰かを傷つけたくなる
        ときどき 本当にそうしてしまう
        与えて また奪う 自由みたいなものを演じる

        ときどき 友達を傷つけたくなる
        ときどき 本当にそうしてしまう
        冷たい笑い 立ち上がる 無関心を演じている

        There’s a secret between us.
        君が残したものが 私になる
        残酷にもなれる やさしくもなれる
        抱きしめて すぐ背を向けることもできる

        不安が来た 離れるのが少し心苦しい
        息をしようとしても ここには空気がない
        微笑んで 立ち上がる
        きっと 君を感じている
        君は現れ 君は去り 君こそがこの世の決まり
        一本の煙草　ひとつの眼差し キーボードを打つ音
        言葉が また言葉を呼ぶ
        あまりにも簡単に
        すべてを壊したのは自分だと 信じてしまうほど

        ときどき 誰かを傷つけたくなる
        ときどき 本当にそうしてしまう
        与えて また奪う 自由みたいなものを演じる

        ときどき 友達を傷つけたくなる
        ときどき 本当にそうしてしまう
        冷たい笑い 立ち上がる 無関心を演じている

        There’s a secret between us.
        君が残したものが 私になる
        残酷にもなれる やさしくもなれる
        抱きしめて すぐ背を向けることもできる

        I keep the secret between us.
        君が残したものは 私だけ
        暴力にもなれる 無邪気にもなれる
        笑いながら 「少し痛い」って言えるくらいに
        少し痛い

        I take it all.
        I just take it all.
        Can’t help but take it all.
        I take it all.
      kr: |
