        한 마디, 또 한 마디씩 이어지는 말들
        그토록 쉽게 흘러나와선
        결국 모든 걸 망쳐버린 건 나 자신이라 믿게 해

        어떨 때 누군가를 해치고 싶은 생각이 들어
        가끔은 정말로 저질러 버리기도 해
        주고선 다시 거둬들이며, 하나의 자유를 연기해

