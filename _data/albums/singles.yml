        There’s a secret between us.
        당신이 남겨둔 것들이 지금의 나를 만들었지
        잔인할 수도, 한없이 다정할 수도 있는 나
        안아준 뒤 곧바로 뒤돌아설 수 있는 나

        I keep the secret between us.
        당신이 남긴 건 오직 나뿐인 것
        폭력적일 수도, 한없이 순수할 수도 있는 나
        아무렇지 않게 웃으며, 조금 아프다고 말할 수 있는 나
