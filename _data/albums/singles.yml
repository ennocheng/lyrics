        Can’t help but take it all.
        I take it all.
  - title: 你是真的不懂
    en_title: The Orange of My Eye
    lyricist: 鄭宜農
    composer: 鄭宜農
    from_album: 《看你聽的》系列主題曲（2025）
    default_language: zh
    lyrics:
