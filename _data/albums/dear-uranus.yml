        Human and all living things, the original intention of surviving
        Is deeply, deeply, deeply yearning

        Millions upon millions of unspoken words sparkle in the dark
        Millions upon millions of unseen tears rush into a galaxy
        Millions upon millions of lonely little stars wait for a miracle
        They're millions upon millions of me, and millions upon millions of you

        There are moments, when we're drowned by loneliness
        In memories of the past, at the border of regrets
        Pain, struggle, howling
        Among millions upon millions of stars, a single dot
        A sincere heart, wholeheartedly longing, and so it shines
