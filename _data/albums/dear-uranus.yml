album_title: 給天王星 Dear Uranus
album_year: 2019
songs:
  - title: 2017，你。
    en_title: Dear Uranus,
    lyricist: 鄭宜農
    composer: 鄭宜農
    default_language: zh
    lyrics:
      zh: |
        我這樣 看著你
        彷彿能看上幾次換季
        看透你披戴著時間的衣
        把所有無奈都妝點成星星
        不厭膩 怎會厭膩
        繁星背後萬千個秘密
        多少光年的孤寂
        終於誕生了眼前的風景

        在意義完全之前
        每個爆炸的瞬間
        在我的注視裡面
        成為了永恆的畫面
        在宇宙重來之前
        讓我再靠近一些
        不必再去想 怎麼進去這世界
        因為你就是 你就是

        就這樣 緩緩地
        彷彿寂寞渺小的身影
        誰也不知道那滿載的心
        正一步一步跟隨你的指引
        不厭膩 怎會厭膩
        繁星點點看得我入迷
        多少光年的孤寂
        終於盼到了眼前風景

        在意義完全之前
        每個爆炸的瞬間
        在我的注視裡面
        成為了永恆的畫面
        在宇宙重來之前
        讓我再靠近一些
        不必再去想 怎麼進去這世界
        因為你就是 你就是
        我生命的慶典

  - title: 街仔路雨落袂停
    en_title: At a rainy night (Would you walk me home?)
    lyricist: 鄭宜農、陳嫺靜
    composer: 鄭宜農、陳嫺靜
    default_language: ta
    lyrics:
      ta: |
        〈街仔路雨落袂停〉

        又是孤身的烏暗暝
        人去樓空 心事茫茫
        街仔路雨落袂停
        你敢佇遐 思慕的人

        一擺又一擺 阮鬥陣唱悲傷的歌
        你真正沒聽著我歌聲內的寄望？
        往事親像海湧共阮淹甲毋知人
        我毋甘願又踮佇遮
        你敢欲做伙行？

        又是孤身的烏暗暝
        人去樓空 心事茫茫
        街仔路雨落袂停
        你敢佇遐 思慕的人

        吹吹等甲風來吹
        天頂的星攏歕落地
        城市的燈火吹袂飛
        茫茫大雨內底
        吹吹等甲風來吹
        天頂的星攏歕落地
        城市的燈火吹袂飛

        茫茫大雨內 駛過你的巷子口
        窗仔外人咧走 水咧流
        親像做眠夢 有人對我大聲喝
        哎喲 哎喲
        聽著落雨聲就想著你
        日頭出來前欲走對佗位去
        坐佇車內嘛會淋著雨
        我的火車走袂停

        毋是無要緊 你是一擺兩擺三擺轉去就袂記得閣走
        毋是無想你 是一擺兩擺三擺 我嘛佇雨內等待

        一擺又一擺 阮鬥陣唱悲傷的歌
        你真正沒聽著我歌聲內的寄望？
        往事親像海湧共阮淹甲毋知人
        我毋甘願又踮佇遮
        你敢欲做伙行？

        街仔路雨落袂停
        你敢佇遐 思慕的人
      en: |
        〈At a rainy night (Would you walk me home?)〉

        Another lonely night
        Empty house, heart full of worries
        The rain keeps failling on the street
        Are you there? The one I miss

        Again and again, we sing sad songs together
        Haven't you heard the hope in my voice?
        The past is like waves, we're drowning in the crest
        I'm not willing to linger here
        Will you come with me?

        Another lonely night
        Empty house, heart full of worries
        The rain keeps failling on the street
        Are you there? The one I miss

        When the wind comes
        The stars in the sky are blown to the ground
        Blowing past the city lights, yet they can't fly
        In the pouring rain
        When the wind comes
        The stars in the sky are blown to the ground
        Blowing past the city lights, yet they can't fly

        Driving past your alley in the pouring rain
        Outside, people walking, water flowing
        Like a dream, someone shouts at me
        Hey hey
        Listening to the rain, I think of you
        Before the sun rises, where to go?
        Even in the car, the rain pours in
        My train keeps running

        Not that I don't care; it's one, twice, thrice, you go back and forget to leave
        Not that I don't miss you; it's one, twice, thrice, I'm waiting in the rain

        Again and again, we sing sad songs together
        Haven't you heard the hope in my voice?
        The past is like waves, we're drowning in the crest
        I'm not willing to linger here
        Will you come with me?

        The rain keeps failling on the street
        Are you there? The one I miss
  - title: 591
    lyricist: 鄭宜農
    composer: 鄭宜農
    default_language: zh
    lyrics:
      zh: |
        〈591〉

        想要一張 又軟又大又能做好夢的床
        轉過身去就能聞到你的枕頭香
        床的旁邊 是一片隨風搖曳著的白窗簾
        有兩隻貓在窗臺上面鄙視世界
        一張餐桌 兩杯開水
        短短的書櫃先讓我隨便堆
        在下一次你受不了之前

        要不要 你要不要來
        陪我一起完成這不算大的心願
        雖然可能有太多樓梯
        在老去之前我們就稍微喘一點
        吃簡單一點 酒喝少一些
        再努力一點說不定運氣好一點
        再過個幾年 或許還能有個管理員

        冬天晚上 洗澡的水可能會有一點涼
        你熱杯牛奶讓我出來能捧在手心上
        來到夏天 不然我們去附近的咖啡店
        等太陽下山還可以一起散步去公園
        一條長路 說不完的話
        殘忍的世界都變得不可怕
        在下一次悲傷又來之前

        要不要 你要不要來
        陪我一起完成這不算大的心願
        雖然可能有太多樓梯
        在老去之前我們就稍微喘一點
        吃簡單一點 酒喝少一些
        再努力一點說不定運氣好一點
        再過個幾年 也許走慢一些

        要不要 你要不要來
        陪我一起完成這不算大的心願
        雖然可能有太多樓梯
        在老去之前我們就稍微喘一點
        吃簡單一點 酒喝少一些
        再努力一點說不定運氣好一點
        再過個幾年 或許還能有個管理員
      en: |
        〈591〉

        Want a bed soft and big, where good dreams can be had
        Turn over and smell the scent from your pillow
        Beside the bed, white curtains swaying in the breeze
        Two cats on the windowsill judging the world
        A dining table, two glasses of water
        A short bookshelf, let me just pile things up
        Before you've had enough

        Won't you, won't you come
        Join me in making this small wish come true
        Though there might be too many stairs
        Before we grow old, we'll just breathe a little harder
        Eat a bit simpler, drink a little less
        Try a bit harder, maybe our luck will get better
        In a few more years, maybe we'll even have a doorman

        On winter evenings, the shower might be a little cold
        You warm a cup of milk, so when I come out, I can hold it in my hands
        When summber comes, we could go to the coffee shop nearby
        Wait for the sun to set and stroll together to the park
        A long road, endless things to say
        The cruel world becomes less frightening
        Before sadness comes again

        Won't you, won't you come
        Join me in making this small wish come true
        Though there might be too many stairs
        Before we grow old, we'll just breathe a little harder
        Eat a bit simpler, drink a little less
        Try a bit harder, maybe our luck will get better
        In a few more years, maybe we'll walk a little slower

        Won't you, won't you come
        Join me in making this small wish come true
        Though there might be too many stairs
        Before we grow old, we'll just breathe a little harder
        Eat a bit simpler, drink a little less
        Try a bit harder, maybe our luck will get better
        In a few more years, maybe we'll even have a doorman
  - title: 輕輕觸碰
    en_title: The touch.
    lyricist: 鄭宜農
    composer: 鄭宜農
    default_language: zh
    lyrics:
      zh: |
        輕輕觸碰
        你一瞬間的天真
        我輕輕觸碰 它能不能成為雋永？

        慢慢地走
        當你牽起我的手
        我會慢慢地走
        把你每一步都看透

        過去你遺忘的讓我們從頭開始
        過去你記得的無論悲傷快樂 我都聽你說
        好嗎？親愛的

        輕輕觸碰
        在你的堅韌背後
        我輕輕觸碰 其實太巨大的溫柔

        慢慢地走
        當你牽起我的手
        我會慢慢地走 走過一世細水長流

        過去你遺忘的讓我們從頭開始
        過去你記得的無論悲傷快樂 我都聽你說
        好嗎？親愛的

        過去你遺忘的讓我們從頭開始
        過去你記得的無論悲傷快樂 我都聽你說
        過去沒看過的讓我們現在開始
        過去你看過的但願它們能笑看 我的笨拙

  - title: 賊
    en_title: Thief
    lyricist: 鄭宜農
    composer: 鄭宜農
    default_language: zh
    lyrics:
      zh: |
        它是那樣不受控制的孩子
        在最平凡的日子裡 特別不安定
        如果它偷走年邁的你的記憶
        但願你能讓陌生的我愛你

        曾經以為 我要的只是璀璨的一瞬
        無堅不摧 多麼美
        太自以為 此刻我看著你臉上的紋
        害怕著命運這個賊

        它是那樣讓人緊張的瘋子
        在新聞裡頭倒數著末日的來襲
        如果它偷走渺小的我的生命
        但願你能開始學習放下這件事情

        曾經以為 我要的只是璀璨的一瞬
        無堅不摧 多麼美
        太自以為 此刻我看著你臉上的紋
        害怕著命運這個賊
        害怕著卻無從防備

        它是那樣不受控制的孩子
        在最平凡的日子裡 特別不安定
        如果它偷走年邁的你的記憶
        但願你能讓陌生的我愛你
        但願我能學會放下這件事情

