        但我想你一起走

        就算我保護著自己 請你別放棄我
        就像我始終願意 感覺你的痛
        感覺你慢慢鬆開 緊握的拳頭
        感覺在某個瞬間 我們都赤裸

        或許有時候殘忍
        或許有時候天真
        或許我從來沒有變成一個大人
