  - title: 就算我放棄了世界
    en_title: Never let me go.
    lyricist: 鄭宜農
    composer: 鄭宜農
    default_language: zh
    lyrics:
      zh: |
        〈就算我放棄了世界〉

        就算我放棄了世界 請你別放棄我
        就像我始終願意 靜靜聽你說
        聽你走路的聲音 聽你的靜默
