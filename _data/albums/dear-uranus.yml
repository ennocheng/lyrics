      en: |
        〈Never let me go〉

        Even if I give up the world, please don't give up one me
        Just like I'm always willing to quietly listen to you
        Listen to your footsteps, Listen to your silence
        Listen to you open a door, memories flowing through

        Maybe sometimes cruel
        Maybe sometimes naive
        Maybe I never become an adult
        But I want to hold your hand
        But I want to walk with you

        Even if I guard myself, please don't give up one me
        Just like I'm always willing to feel your pain
        Feel you slowly loosen your clenched fist
        Feel at some point we're both naked

        Maybe sometimes cruel
        Maybe sometimes naive
        Maybe I never become an adult
        But I want to hold your hand
        But I want to walk with you
        But I want to hold your hand
        That's it
        No need to be confused
  - title: 千千萬萬
    en_title: Lightyears of solitude
    lyricist: 鄭宜農
    composer: 鄭宜農
    default_language: zh
    lyrics:
      zh: |
        〈千千萬萬〉

        倒數十秒鐘 又一顆星球停止運轉
        每秒三十公里 愚蠢的話撞了上來
        誰聽見了嗎？在億萬光年之外

        乖乖點點頭 又一顆真心放棄期待
        幾千焦耳的匯集 靈魂碎成一塊一塊
        誰聽見了嗎？在億萬光年之外
        可是這裏沒有空氣 只有高質量的秘密
        它們安靜的爆炸了

        於是 千千萬萬句說不出口的話 在黑夜裡放光明
